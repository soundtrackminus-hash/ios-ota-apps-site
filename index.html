<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iPhone Apps — Каталог iOS приложений</title>
  <meta name="description" content="Каталог iOS-приложений для установки через itms-services manifest.plist">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero__badge">iOS OTA Install · <span id="total-count">0</span> приложений</div>
    <h1>Каталог iPhone-приложений</h1>
    <p>Открой эту страницу в Safari на iPhone и нажми «Установить на iPhone» у нужного приложения.</p>
  </header>
  <main>
    <section class="notice">
      <strong>Важно:</strong> установка через <code>itms-services</code> требует Safari и доверия сертификату.
    </section>
    
    <section class="toolbar" aria-label="Фильтры и поиск">
      <div class="toolbar__search">
        <label for="search">🔍 Поиск</label>
        <input id="search" type="search" placeholder="Название, bundle id…" autocomplete="off">
      </div>
      <div class="toolbar__filters">
        <label for="sort">↕ Сортировка:</label>
        <select id="sort">
          <option value="name-asc">По названию (А-Я)</option>
          <option value="name-desc">По названию (Я-А)</option>
          <option value="size-asc">По размеру (↑)</option>
          <option value="size-desc">По размеру (↓)</option>
        </select>
      </div>
      <div class="counter"><span id="shown-count">0</span> из <span id="total-count-display">0</span></div>
    </section>
    
    <section class="apps" aria-label="Список приложений" id="apps-container"></section>
  </main>
  
  <script src="app-data.js"></script>
  <script src="app-store.js"></script>
</body>
</html>
