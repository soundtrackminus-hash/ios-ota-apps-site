  <main class="main-content">
    <section class="hero-section">
      <h1>Каталог приложений</h1>
      <p>Установка iOS-приложений на iPhone через Safari</p>
    </section>
    
    <!-- Панель фильтров -->
    <section class="toolbar">
      <div class="search-box">
        <input type="search" id="search" placeholder="Поиск приложения..." autocomplete="off">
      </div>
      <div class="sort-box">
        <select id="sort">
          <option value="name-asc">По названию</option>
          <option value="size-desc">По размеру ↓</option>
          <option value="size-asc">По размеру ↑</option>
        </select>
      </div>
      <span class="counter"><span id="shown-count">0</span> из <span id="total-count">0</span></span>
    </section>
    
    <!-- Список приложений -->
    <div class="apps-grid" id="apps-container"></div>
  </main>
  
  <script src="app-data.js"></script>
  <script src="app-store.js"></script>
